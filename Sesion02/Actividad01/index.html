<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiencia 01 | Aplicación CSS</title>
  
  <link rel="stylesheet" href="styles.css">
  
  <style>.mensaje-cabecera { background: #e9ddc9; padding: 14px; border-left: 5px solid #b88648; }</style>
</head>
<body>
  <header><a href="../index.html">← Inicio</a><p>Experiencia 01</p><h1>Tres formas de aplicar CSS</h1></header>
  <main>
    <section class="tarjeta"><h2>CSS vinculado</h2><p>Esta tarjeta recibe estilos desde <code>styles.css</code>.</p></section>
    <section class="mensaje-cabecera"><h2>CSS en cabecera</h2><p>Este bloque usa la regla escrita dentro de la etiqueta <code>&lt;style&gt;</code>.</p></section>
    
    <section style="background:#315746; color:white; padding:24px; border-radius:8px;"><h2>CSS en línea</h2><p style="margin-bottom:0; color:#f5d89b;">Sus propiedades están directamente en las etiquetas HTML.</p></section>
  </main>
</body></html>
